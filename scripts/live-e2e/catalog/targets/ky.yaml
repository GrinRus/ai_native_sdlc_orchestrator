        measurement: post-run primary verification
    definition_of_done:
      - Bounded primary verification passes and the focused release AVA suite is preserved as diagnostic evidence.
      - Delivery and release packet evidence are anchored to the target checkout.
      - No upstream write-back is attempted.
    expected_evidence: &a3
      - delivery-manifest
      - release-packet
      - review-report
    acceptance_checks:
