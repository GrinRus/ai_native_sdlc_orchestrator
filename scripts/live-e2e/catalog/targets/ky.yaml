        - implementation_completeness
        - test_adequacy
        - code_maintainability
        - verification_quality
        - delivery_safety
        - acceptance_criteria_traceability
  - mission_id: ky-retry-hooks-governance
    title: Exercise one broader retry and hooks governance-safe change
    brief: Touch one broader request lifecycle surface with bounded regression coverage, stricter audit
      expectations, and no control-plane leakage.
    feature_size: large
    goals:
      - Exercise one broader retry or hooks lifecycle change with governance-safe evidence.
      - Keep audit, review, and learning closure linked to the target checkout.
    kpis:
      - kpi_id: ky-governance-lineage
        name: Governance lineage
        target: review, delivery, audit, and learning artifacts preserve the same matrix cell
        measurement: scenario coverage and artifact consistency checks
    definition_of_done:
      - Bounded primary verification passes and Playwright-backed diagnostic full-suite output is
        recorded.
      - Governance, audit, and learning evidence links back to the mission and target checkout.
    expected_evidence: &a4
      - verify-summary
      - routed-step-result
      - review-report
      - delivery-manifest
      - learning-loop-handoff
    acceptance_checks:
      - preserve repo-local request lifecycle boundaries
      - keep governance and audit evidence linked to the target checkout
      - avoid any upstream write-back
    change_evidence:
      required_path_prefixes:
        - source/
        - test/
        - index.d.ts
    post_run_quality:
      primary_commands:
        - npx xo
        - npm run build
        - "npx ava test/main.ts test/hooks.ts --match='!*totalTimeout bounds a never-ending successful response body*'"
        - npx ava test/retry.ts --match='*shouldRetry*'
      diagnostic_commands:
        - npx playwright install
        - npm test -- --match='!*totalTimeout bounds a never-ending successful response body*'
        - npx ava test/main.ts --match='totalTimeout bounds a never-ending successful response body'
      diagnostic_failure_mode: warn
    supported_scenarios:
      - governance
      - repair
    recommended_provider_variants:
      - openai-primary
      - anthropic-primary
      - open-code-primary
    size_budget:
      max_changed_files: 64
      max_added_lines: 4500
    size_rationale: Large ky missions can cross multiple request lifecycle seams, but must still remain
      inside one repository package and explicit bounds.
    change_budget:
      max_changed_files: 64
      max_added_lines: 4500
    quality_evidence: *a4
    mission_class: product-change
    task_plan:
      local_tasks:
        - task_id: task.retry-lifecycle-source
          title: Implement the governed retry lifecycle change
          type: implementation
          objective: Apply the approved retry or hook lifecycle behavior inside the Ky source surface.
          rationale: The large mission needs one explicit runtime owner before cross-surface verification and governance closure.
          scope:
            repo_ids: [ky]
            component_ids: []
            allowed_paths: [source/**]
            forbidden_paths: []
          depends_on: []
          work_items:
            - Map the approved lifecycle behavior to the smallest compatible runtime seams.
            - Preserve request, retry, and hook ordering outside the mission.
          criteria_refs:
            - goal.1
            - kpi.ky-governance-lineage
            - dod.1
            - acceptance.1
          verification:
            command_group_refs: []
            validators: [repo-scope]
            manual_checks: []
            success_conditions:
              - The runtime lifecycle change stays inside the approved source boundary.
          expected_evidence: [routed-step-result, review-report]
          risks:
            - Retry and hook ordering changes can affect multiple request lifecycle phases.
          stop_conditions:
            - The implementation requires unrelated control-plane or repository changes.
          execution_hints:
            group_key: null
            group_reason: null
            parallel_candidate: false
        - task_id: task.retry-hooks-tests
          title: Add lifecycle and hooks regression coverage
          type: verification
          objective: Prove retry, hooks, and request lifecycle behavior with the required focused and broad Ky tests.
          rationale: Large qualification needs direct regression signals across the touched lifecycle seams.
          scope:
            repo_ids: [ky]
            component_ids: []
            allowed_paths: [test/**]
            forbidden_paths: []
          depends_on: [task.retry-lifecycle-source]
          work_items:
            - Add focused regression cases using existing AVA conventions.
            - Run lint, build, main, hooks, focused retry, and split diagnostic commands.
          criteria_refs:
            - goal.1
            - kpi.ky-governance-lineage
            - dod.1
            - acceptance.1
          verification:
            command_group_refs: []
            validators: [evidence-complete]
            manual_checks: []
            success_conditions:
              - Primary and diagnostic verification preserve a clear lifecycle regression signal.
          expected_evidence: [verify-summary]
          risks:
            - Timing-sensitive retry tests may require the catalog's isolated diagnostic command.
          stop_conditions:
            - Required verification is unavailable or introduces a new blocking failure.
          execution_hints:
            group_key: null
            group_reason: null
