    quality_evidence: *a3
    mission_class: product-change
    agent_visible_request:
      user_problem: Land one bounded API or typing fix with matching regression coverage and release-ready
        lineage.
      desired_outcome: Bounded primary verification passes and the focused release AVA suite is preserved as diagnostic
        evidence. Delivery and release packet evidence are anchored to the target checkout. No
