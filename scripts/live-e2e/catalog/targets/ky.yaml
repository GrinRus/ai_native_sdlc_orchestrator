catalog_id: ky
repo:
  repo_id: sindresorhus/ky
  repo_url: https://github.com/sindresorhus/ky.git
  ref: main
  checkout_strategy: shallow
verification:
  execution_environment: ci
  setup_commands:
    - npm install --prefer-offline --no-audit --no-fund
    - npx playwright install
  commands:
    - npm test -- --match='!*totalTimeout bounds a never-ending successful response body*'
    - npx ava test/main.ts --match='totalTimeout bounds a never-ending successful response body'
safety_defaults:
  write_back_to_remote: false
  preferred_delivery_mode: patch-only
qualification_policy:
  explicit_task_plan_mission_ids:
    - ky-fetch-options-regression
    - ky-retry-hooks-governance
required_matrix_cells:
  - cell_id: ky.regress.small.openai
    scenario_family: regress
    feature_size: small
    feature_mission_id: ky-header-regression
    provider_variant_id: openai-primary
    coverage_tier: required
  - cell_id: ky.regress.small.anthropic
    scenario_family: regress
    feature_size: small
    feature_mission_id: ky-header-regression
    provider_variant_id: anthropic-primary
    coverage_tier: extended
  - cell_id: ky.regress.medium.openai
    scenario_family: regress
    feature_size: medium
    feature_mission_id: ky-fetch-options-regression
    provider_variant_id: openai-primary
    coverage_tier: extended
  - cell_id: ky.regress.medium.anthropic
    scenario_family: regress
    feature_size: medium
    feature_mission_id: ky-fetch-options-regression
    provider_variant_id: anthropic-primary
    coverage_tier: extended
  - cell_id: ky.release.medium.openai
    scenario_family: release
    feature_size: medium
    feature_mission_id: ky-release-doc-typing
    provider_variant_id: openai-primary
    coverage_tier: extended
  - cell_id: ky.regress.small.open-code
    scenario_family: regress
    feature_size: small
    feature_mission_id: ky-header-regression
    provider_variant_id: open-code-primary
    coverage_tier: extended
  - cell_id: ky.regress.medium.open-code
    scenario_family: regress
    feature_size: medium
    feature_mission_id: ky-fetch-options-regression
    provider_variant_id: open-code-primary
    coverage_tier: extended
  - cell_id: ky.regress.small.qwen
    scenario_family: regress
    feature_size: small
    feature_mission_id: ky-header-regression
    provider_variant_id: qwen-primary
    coverage_tier: extended
  - cell_id: ky.regress.medium.qwen
    scenario_family: regress
    feature_size: medium
    feature_mission_id: ky-fetch-options-regression
    provider_variant_id: qwen-primary
    coverage_tier: extended
  - cell_id: ky.governance.large.openai
    scenario_family: governance
    feature_size: large
    feature_mission_id: ky-retry-hooks-governance
    provider_variant_id: openai-primary
    coverage_tier: extended
  - cell_id: ky.governance.large.anthropic
    scenario_family: governance
    feature_size: large
    feature_mission_id: ky-retry-hooks-governance
    provider_variant_id: anthropic-primary
    coverage_tier: extended
provider_comparison_pairs:
  - pair_id: ky.regress.small
    scenario_family: regress
    feature_size: small
    feature_mission_id: ky-header-regression
    provider_variants:
      - openai-primary
      - anthropic-primary
  - pair_id: ky.release.medium
    scenario_family: release
    feature_size: medium
    feature_mission_id: ky-release-doc-typing
    provider_variants:
      - openai-primary
      - anthropic-primary
  - pair_id: ky.governance.large
    scenario_family: governance
    feature_size: large
    feature_mission_id: ky-retry-hooks-governance
    provider_variants:
      - openai-primary
      - anthropic-primary
manual_matrix_cells:
  - cell_id: ky.governance.xlarge.openai
    scenario_family: governance
    feature_size: xlarge
    feature_mission_id: ky-request-lifecycle-observability-xlarge
    provider_variant_id: openai-primary
    coverage_tier: manual
  - cell_id: ky.governance.xlarge.anthropic
    scenario_family: governance
    feature_size: xlarge
    feature_mission_id: ky-request-lifecycle-observability-xlarge
    provider_variant_id: anthropic-primary
    coverage_tier: manual
feature_missions:
  - mission_id: ky-header-regression
    title: Preserve narrow header-normalization regression coverage
    brief: Add or adjust one bounded regression test around header handling and the smallest source fix
      needed to satisfy it.
    feature_size: small
    goals:
      - Preserve one focused header-normalization behavior with a source or test change.
    kpis:
      - kpi_id: ky-header-regression-green
        name: Header regression gate
        target: npx ava test/headers.ts passes after the change
        measurement: post-run primary verification
    definition_of_done:
      - The header regression gate, lint, and build commands pass.
      - Review evidence links the changed paths to the catalog mission.
    expected_evidence: &a1
      - verify-summary
      - routed-step-result
      - review-report
    acceptance_checks:
      - keep changes inside source and test folders only
      - preserve Playwright setup and the complete split AVA suite as diagnostic evidence
      - pass the mission-scoped headers regression gate
    change_evidence:
      required_path_prefixes:
        - source/
        - test/
    post_run_quality:
      primary_commands:
        - npx xo
        - npm run build
        - npx ava test/headers.ts
      diagnostic_commands:
        - npx playwright install
        - npm test -- --match='!*totalTimeout bounds a never-ending successful response body*'
        - npx ava test/main.ts --match='totalTimeout bounds a never-ending successful response body'
      diagnostic_failure_mode: warn
    supported_scenarios:
      - regress
    recommended_provider_variants:
      - openai-primary
      - anthropic-primary
      - open-code-primary
      - qwen-primary
    size_budget:
      max_changed_files: 16
      max_added_lines: 900
    size_rationale: One narrow library regression should stay inside one behavior surface and one test seam.
    change_budget:
      max_changed_files: 16
      max_added_lines: 900
    quality_evidence: *a1
    mission_class: flow-regression
    agent_visible_request:
      user_problem: Add or adjust one bounded regression test around header handling and the smallest
        source fix needed to satisfy it.
      desired_outcome: The header regression gate, lint, and build commands pass. Review evidence links
        the changed paths to the catalog mission.
      constraints:
        - Use this mission only as a live E2E canary that proves the public flow still works.
        - Use the target repository conventions and existing test style.
        - Keep test changes in test/headers.ts because it is the only test file exercised by the
          mission-primary AVA command; if another test file must change, leave it unchanged and
          report a verification-scope mismatch.
        - Keep upstream writes disabled; materialize delivery evidence only through the configured
          no-write or patch/fork mode.
        - Do not mutate target files directly from the runner or evaluator outside the public AOR
          execution, review, and repair loop.
        - keep changes inside source and test folders only
        - preserve Playwright setup and the complete split AVA suite as diagnostic evidence
        - pass the mission-scoped headers regression gate
      non_goals:
        - Do not expand this small canary into a product-quality acceptance mission.
        - Do not write provider-local state, editor artifacts, temporary runtime files, or unrelated
          root files into the target diff.
        - Do not bypass AOR review, QA, delivery, or learning artifacts with a direct patch handoff.
    evaluator_rubric:
      quality_gate: flow-health
      step_quality_required: false
      step_quality_dimensions:
        - traceability
        - completeness
        - actionability
        - evidence_strength
        - black_box_boundary
      evidence_expectations:
        - Accepted public step decision refs for the canary flow.
        - verify-summary
        - routed-step-result
        - review-report
        - "Primary verification command: npx xo"
        - "Primary verification command: npm run build"
        - "Primary verification command: npx ava test/headers.ts"
        - "Diagnostic evidence command: npx playwright install"
        - "Diagnostic evidence command: npm test with the timing-sensitive totalTimeout case excluded"
        - "Diagnostic evidence command: isolated timing-sensitive totalTimeout case"
        - Meaningful changed path under source/
        - Meaningful changed path under test/
    final_code_rubric:
      quality_gate: flow-health
      required_changed_surfaces:
        - source/
        - test/
      acceptance_dimensions:
        - flow_completion
        - public_artifact_materialization
        - canary_verification
  - mission_id: ky-fetch-options-regression
    title: Extend one bounded fetch-options regression across source and typings
    brief: Adjust one multi-file options-handling or retry-surface regression with matching tests and
      the smallest typing touch needed to keep the public API coherent.
    feature_size: medium
    goals:
      - Repair one bounded fetch-options or retry-surface regression across source, tests, and type
        surface.
    kpis:
      - kpi_id: ky-fetch-options-bounded-green
        name: Bounded fetch-options gate
        target: lint, build, and targeted AVA coverage pass after the change
        measurement: post-run primary verification
    definition_of_done:
      - The change stays inside source, tests, and public type surface.
      - Bounded primary verification passes and the Playwright-backed complete split AVA suite is
        recorded as diagnostic evidence.
    expected_evidence: &a2
      - verify-summary
      - routed-step-result
      - review-report
      - delivery-manifest
    acceptance_checks:
      - keep the fix inside source, tests, and type surface only
      - preserve Playwright setup and the complete split AVA suite as diagnostic evidence
      - keep delivery evidence anchored to the target checkout
    change_evidence:
      required_path_prefixes:
        - source/
        - test/
        - index.d.ts
    post_run_quality:
      primary_commands:
        - npx xo
        - npm run build
        - npx ava test/fetch.ts
        - npx ava test/hooks.ts
        - npx ava test/retry.ts --match='*shouldRetry*'
      diagnostic_commands:
        - npx playwright install
        - npm test -- --match='!*totalTimeout bounds a never-ending successful response body*'
        - npx ava test/main.ts --match='totalTimeout bounds a never-ending successful response body'
      diagnostic_failure_mode: warn
    supported_scenarios:
      - regress
      - repair
    recommended_provider_variants:
      - openai-primary
      - anthropic-primary
      - open-code-primary
      - qwen-primary
    size_budget:
      max_changed_files: 32
      max_added_lines: 2200
    size_rationale: Medium ky missions may cross one behavior seam plus one type boundary, but should
      remain bounded to one package.
    change_budget:
      max_changed_files: 32
      max_added_lines: 2200
    quality_evidence: *a2
    mission_class: product-change
    task_plan:
      local_tasks:
        - task_id: task.fetch-options-source
          title: Implement the bounded fetch-options behavior
          type: implementation
          objective: Repair the approved fetch-options or retry behavior inside the Ky source surface.
          rationale: The runtime behavior must be corrected before tests and public typings can prove coherence.
          scope:
            repo_ids: [ky]
            component_ids: []
            allowed_paths: [source/**]
            forbidden_paths: []
          depends_on: []
          work_items:
            - Locate the narrow options-handling or retry seam covered by the approved mission.
            - Implement the smallest compatible runtime change within source.
          criteria_refs:
            - goal.1
            - kpi.ky-fetch-options-bounded-green
            - dod.1
            - acceptance.1
          verification:
            command_group_refs: []
            validators: [repo-scope]
            manual_checks: []
            success_conditions:
              - Runtime behavior changes only inside the approved source boundary.
          expected_evidence: [routed-step-result, review-report]
          risks:
            - Existing fetch option precedence may rely on the current behavior.
          stop_conditions:
            - The fix requires a repository surface outside the approved mission.
          execution_hints:
            group_key: null
            group_reason: null
            parallel_candidate: false
        - task_id: task.fetch-options-tests
          title: Add focused fetch-options regression coverage
          type: verification
          objective: Prove the runtime change through the mission-focused hooks and retry tests.
          rationale: The regression must fail before the fix and protect the changed behavior afterward.
          scope:
            repo_ids: [ky]
            component_ids: []
            allowed_paths: [test/**]
            forbidden_paths: []
          depends_on: [task.fetch-options-source]
          work_items:
            - Add or refine focused regression coverage in the existing AVA style.
            - Run the bounded lint, build, hooks, and retry verification commands.
          criteria_refs:
            - kpi.ky-fetch-options-bounded-green
            - dod.2
            - acceptance.2
          verification:
            command_group_refs: []
            validators: [evidence-complete]
            manual_checks: []
            success_conditions:
              - Focused primary verification passes and diagnostic evidence remains linked.
          expected_evidence: [verify-summary]
          risks:
            - Timing-sensitive full-suite behavior can obscure the focused regression signal.
          stop_conditions:
            - The focused test cannot distinguish the repaired behavior from the baseline.
          execution_hints:
            group_key: null
            group_reason: null
            parallel_candidate: false
        - task_id: task.fetch-options-types-delivery
          title: Align public typings and close delivery evidence
          type: integration
          objective: Keep the public type surface coherent and bind review and patch-only delivery to the verified change.
          rationale: The medium mission explicitly crosses the runtime, test, and public type boundaries.
          scope:
            repo_ids: [ky]
            component_ids: []
            allowed_paths: [index.d.ts]
            forbidden_paths: []
          depends_on: [task.fetch-options-source, task.fetch-options-tests]
          work_items:
            - Adjust the public typing only when required by the approved behavior.
            - Confirm review traceability and patch-only delivery without upstream write-back.
          criteria_refs:
            - goal.1
            - goal.2
            - kpi.ky-fetch-options-bounded-green
            - dod.1
            - dod.2
            - acceptance.3
          verification:
            command_group_refs: []
            validators: [contract-shape, evidence-complete]
            manual_checks: []
            success_conditions:
              - Runtime, tests, typings, and delivery evidence describe one coherent bounded change.
          expected_evidence: [delivery-manifest, review-report]
          risks:
            - An unnecessary typing change would widen the patch without improving compatibility.
          stop_conditions:
            - Public typing compatibility cannot be preserved inside index.d.ts.
          execution_hints:
            group_key: null
            group_reason: null
            parallel_candidate: false
    agent_visible_request:
      user_problem: Adjust one multi-file options-handling or retry-surface regression with matching tests
        and the smallest typing touch needed to keep the public API coherent.
      desired_outcome: The change stays inside source, tests, and public type surface. Bounded primary
        verification passes and the Playwright-backed complete split AVA suite is recorded as diagnostic evidence.
      constraints:
        - Deliver a real product change through the full public AOR flow, not a catalog-only or
          no-op patch.
        - Use the target repository conventions and existing test style.
        - Keep upstream writes disabled; materialize delivery evidence only through the configured
          no-write or patch/fork mode.
        - Do not mutate target files directly from the runner or evaluator outside the public AOR
          execution, review, and repair loop.
        - keep the fix inside source, tests, and type surface only
        - preserve Playwright setup and the complete split AVA suite as diagnostic evidence
        - keep delivery evidence anchored to the target checkout
      non_goals:
        - Do not satisfy the mission with documentation-only, fixture-only, or metadata-only churn
          unless the requested product behavior explicitly requires it.
        - Do not write provider-local state, editor artifacts, temporary runtime files, or unrelated
          root files into the target diff.
        - Do not bypass AOR review, QA, delivery, or learning artifacts with a direct patch handoff.
    evaluator_rubric:
      quality_gate: accepted-step-quality-required
      step_quality_required: true
      step_quality_dimensions:
        - traceability
        - completeness
        - actionability
        - evidence_strength
        - black_box_boundary
      evidence_expectations:
        - Accepted step-quality assessment report for every public SDLC step before continuation.
        - verify-summary
        - routed-step-result
        - review-report
        - delivery-manifest
        - "Primary verification command: npx xo"
        - "Primary verification command: npm run build"
        - "Primary verification command: npx ava test/retry.ts --match='*shouldRetry*'"
        - "Diagnostic evidence command: npx playwright install"
        - "Diagnostic evidence command: npm test with the timing-sensitive totalTimeout case excluded"
        - "Diagnostic evidence command: isolated timing-sensitive totalTimeout case"
        - Meaningful changed path under source/
        - Meaningful changed path under test/
        - Meaningful changed path under index.d.ts
    final_code_rubric:
      quality_gate: all-pass-product-quality
      required_changed_surfaces:
        - source/
        - test/
        - index.d.ts
      acceptance_dimensions:
        - implementation_correctness
        - implementation_completeness
        - test_adequacy
        - code_maintainability
        - verification_quality
        - delivery_safety
        - acceptance_criteria_traceability
