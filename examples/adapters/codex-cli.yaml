adapter_id: codex-cli
runner_family: codex
version: 1
default_model: gpt-5.5
supported_models:
  - gpt-5.5
  - gpt-5.6-luna
supported_reasoning_efforts:
  - none
  - low
  - medium
  - high
  - xhigh
  - max
model_aliases:
  coding-primary: gpt-5.5
  coding-fallback: gpt-5.5
  planning-primary: gpt-5.5
  planning-fallback: gpt-5.5
  judge-primary: gpt-5.5
  judge-fallback: gpt-5.5
launch_modes:
  - interactive
  - non-interactive
supported_schema_refs:
  - runner-final-report@v1
supported_output_modes:
  - structured-json
capabilities:
  repo_read: true
  repo_write: true
  shell_commands: true
  structured_output: true
  live_logs: true
  mcp_tools: true
  subagents: true
constraints:
  requires_local_runtime: true
  default_network_mode: deny-by-default
  supports_no_write_rehearsal: true
execution:
  live_baseline: true
  runtime_mode: external-process
  handler: codex-cli-external-runner
  evidence_namespace: evidence://adapter-live/codex-cli
  external_runtime:
    command: codex
    model_argument:
      flag: --model
    reasoning_effort_argument:
      prefix_args:
        - -c
      value_template: model_reasoning_effort="{value}"
    default_args:
      - --model
      - gpt-5.5
      - -c
      - model_reasoning_effort="xhigh"
    permission_policy:
      default_mode: restricted
      modes:
        full-bypass:
          args:
            - --ask-for-approval
            - never
            - exec
            - --ignore-user-config
            - --ignore-rules
            - --json
            - --ephemeral
            - --sandbox
            - workspace-write
        restricted:
          args:
            - exec
            - --ignore-user-config
            - --ignore-rules
            - --json
            - --ephemeral
            - --sandbox
            - workspace-write
    request_via_stdin: false
    request_transport: request-artifact
    request_file:
      mode: pointer-prompt
      message: Execute one directed AOR implementation or repair pass using the provider work packet at {provider_work_packet_path}. Your process cwd and execution_contract.disposable_workspace_boundary.execution_root are the only writable source checkout; evidence inputs are read-only and must never be treated as execution roots. Read it first, open every required resolved_local_refs[].local_path, and for repair open the review decision/report and fix the named findings. Make direct edits only in the disposable execution root when required. Follow execution_contract.output_quality_policy. Run only execution_contract.required_commands, sequentially and in order. Every changed test file must be exercised by a required command; otherwise leave it unchanged and return a bounded verification-scope mismatch. Never repeat readiness setup or package installation and never run controller-owned diagnostics. On sandbox EPERM or EACCES, record bounded environment-limited evidence and finish without retry or target workaround. Do not write upstream. Return a final report with changed-files, commands-run, verification, repair-closure when applicable, and risks. Do not stop after summarizing the packet.
    preflight_timeout_ms: 120000
    timeout_ms: 3600000
sandbox_mode: local-or-container
approval_features:
  supports_human_approval: true
  supports_pause_resume: true
  continuation_strategy: reinvoke
  approval_grant_scope: tool-call-scoped
  approval_resume_mode: restricted
  permission_request_detection:
    - structured-output
    - stdout-stderr-patterns
    - jsonl-events
log_features:
  stdout: true
  stderr: true
  tool_calls: true
  normalized_summary: true
certification_state: stable
