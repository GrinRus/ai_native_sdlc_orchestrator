adapter_id: claude-code
runner_family: claude
version: 1
default_model: claude-opus-4-6
supported_models:
  - claude-opus-4-6
supported_reasoning_efforts:
  - low
  - medium
  - high
  - max
model_aliases:
  coding-primary: claude-opus-4-6
  coding-fallback: claude-opus-4-6
  planning-primary: claude-opus-4-6
  planning-fallback: claude-opus-4-6
  judge-primary: claude-opus-4-6
  judge-fallback: claude-opus-4-6
launch_modes:
  - interactive
  - non-interactive
capabilities:
  repo_read: true
  repo_write: true
  shell_commands: true
  structured_output: true
  live_logs: true
  mcp_tools: true
  subagents: true
constraints:
  requires_local_runtime: true
  default_network_mode: deny-by-default
  supports_no_write_rehearsal: true
execution:
  live_baseline: true
  runtime_mode: external-process
  handler: claude-code-external-runner
  evidence_namespace: evidence://adapter-live/claude-code
  external_runtime:
    command: claude
    model_argument:
      flag: --model
    reasoning_effort_argument:
      prefix_args:
        - --effort
      value_template: "{value}"
    session_budget:
      schema_version: 1
      warn_after_assistant_turns: 24
      max_assistant_turns: 32
      max_tool_calls: 96
      termination_grace_ms: 1000
    permission_policy:
      default_mode: restricted
      modes:
        full-bypass:
          args:
            - --print
            - --output-format
            - stream-json
            - --verbose
            - --no-session-persistence
            - --no-chrome
            - --disable-slash-commands
            - --strict-mcp-config
            - --tools
            - Bash,Edit,Read,Write,Glob,Grep
            - --append-system-prompt
            - Keep this AOR run bounded to one directed implementation pass. Read the provider work packet first and only its required local refs. Use targeted searches, never emit broad repository dumps, do not reread unchanged files, and run only required profile verification commands. Before 24 assistant turns stop new exploration and finalize the implementation report; never exceed 32 assistant turns or 96 tool calls. If the provider context itself overflows, return a blocked final report with failure_class=provider_context_window_exceeded, raw_provider_error_summary, and evidence refs.
            - --effort
            - high
            - --dangerously-skip-permissions
        restricted:
          args:
            - --print
            - --output-format
            - stream-json
            - --verbose
            - --no-session-persistence
            - --no-chrome
            - --disable-slash-commands
            - --strict-mcp-config
            - --tools
            - Bash,Edit,Read,Write,Glob,Grep
            - --append-system-prompt
            - Keep this AOR run bounded to one directed implementation pass. Read the provider work packet first and only its required local refs. Use targeted searches, never emit broad repository dumps, do not reread unchanged files, and run only required profile verification commands. Before 24 assistant turns stop new exploration and finalize the implementation report; never exceed 32 assistant turns or 96 tool calls. If the provider context itself overflows, return a blocked final report with failure_class=provider_context_window_exceeded, raw_provider_error_summary, and evidence refs.
            - --effort
            - high
            - --permission-mode
            - auto
    request_via_stdin: false
    request_transport: request-artifact
    request_file:
      mode: pointer-prompt
      message: Execute one directed AOR implementation or repair pass using the provider work packet at {provider_work_packet_path}. Your process cwd and execution_contract.disposable_workspace_boundary.execution_root are the only writable source checkout; evidence inputs are read-only and must never be treated as execution roots. Read that file first, then open each required resolved_local_refs[].local_path once; for repair open the review decision/report and fix the named findings. Use targeted searches and bounded command output; do not reread unchanged files or dump broad repository content. Make direct edits only in the disposable execution root when required. Follow execution_contract.output_quality_policy. Run only execution_contract.required_commands, sequentially and in order. Every changed test file must be exercised by a required command; otherwise leave it unchanged and return a bounded verification-scope mismatch. Never repeat readiness setup or package installation and never run controller-owned diagnostics. On sandbox EPERM or EACCES, record bounded environment-limited evidence and finish without retry or target workaround. Do not write upstream. Return a final report with changed-files, commands-run, verification, repair-closure when applicable, and risks. Stop new exploration before 24 assistant turns and finalize before 32 assistant turns or 96 tool calls. Do not stop after summarizing the packet. If Claude reports that the prompt or context exceeds the provider limit, return a blocked report with failure_class=provider_context_window_exceeded, raw_provider_error_summary, and evidence refs.
    preflight_timeout_ms: 120000
    timeout_ms: 3600000
sandbox_mode: local-or-container
approval_features:
  supports_human_approval: true
  supports_pause_resume: true
  continuation_strategy: reinvoke
  approval_grant_scope: tool-call-scoped
  approval_resume_mode: restricted
  permission_request_detection:
    - structured-output
    - stdout-stderr-patterns
log_features:
  stdout: true
  stderr: true
  tool_calls: true
  normalized_summary: true
certification_state: candidate
limitations:
  - Structured output reliability must be validated via wrapper-level schema checks.
