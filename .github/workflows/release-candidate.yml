name: Release candidate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_branch:
        description: release/v<semver-alpha> branch to validate
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || inputs.release_branch || github.ref }}
  cancel-in-progress: true

jobs:
  release-candidate:
    name: Release candidate gate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AOR_RELEASE_BRANCH: ${{ github.event.pull_request.head.ref || inputs.release_branch }}
      AOR_RELEASE_STRICT_BRANCH: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.release_branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for release browser acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: Run release candidate gate
        run: pnpm release:gate
